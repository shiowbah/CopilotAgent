name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - name: Build Playwright Docker image
        run: docker build -f Dockerfile.playwright -t copilotagent-playwright .

      - name: Run Playwright tests in Docker
        run: |
          mkdir -p "$GITHUB_WORKSPACE/playwright-report"
          docker run --rm \
            --init \
            --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE/playwright-report:/app/playwright-report" \
            copilotagent-playwright

      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
